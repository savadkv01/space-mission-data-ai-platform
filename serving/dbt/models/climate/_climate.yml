version: 2

# Climate serving data-product contracts + tests (Task 4). Mirrors
# models/serving/_serving.yml: grain uniqueness, KPI ranges, enum validation and
# not-null keys. No AOI is restricted, so no row-level security is required here
# (reuses the existing RLS approach — none needed).
models:
  - name: serving_air_quality_daily
    description: >-
      Air-Quality data product, 1 row per AOI per day. exceedance_flag is null
      unless PM evidence decides it (exceedance_status); a null aqi_band means
      no surface PM measurement, not "Good".
    columns:
      - name: aoi_key
        tests: [not_null]
      - name: date_key
        tests: [not_null]
      - name: pm25_mean
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 2000
      - name: aqi_pm25
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 500
      - name: aqi_band
        tests:
          - accepted_values:
              values: ['Good', 'Moderate', 'Unhealthy (sensitive)', 'Unhealthy',
                       'Very Unhealthy', 'Hazardous',
                       'Satisfactory', 'Poor', 'Very Poor', 'Severe']
      - name: aqi_standard
        tests:
          - not_null
          - accepted_values:
              values: ['US_EPA_PRE2024', 'IN_CPCB_NAQI_2014']
      - name: exceedance_status
        tests:
          - not_null
          - accepted_values:
              values: ['positive', 'negative', 'inconclusive', 'not_evaluated']
      - name: pm_coverage
        tests:
          - not_null
          - accepted_values:
              values: ['pm25_and_pm10', 'pm25_only', 'pm10_only', 'none']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [aoi_key, date_key]

  - name: serving_dust_event_daily
    description: >-
      Dust-Event data product, 1 row per AOI per day. dust_flag / transport_flag
      are null unless evidence decides them (dust_status / transport_status);
      missing UV aerosol index, aerosol model or wind is not a negative.
      aerosol_load_label describes AOD of any aerosol type; dust_severity_label
      uses dust wording only for positive dust rows. aerosol_type is the dominant
      MAIAC aerosol model (smoke / dust / mixed / background). corridor_aod_max
      considers upwind same-region AOIs only.
    columns:
      - name: aoi_key
        tests: [not_null]
      - name: date_key
        tests: [not_null]
      - name: aod_mean
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 5
      - name: dust_severity_band
        tests:
          - accepted_values:
              values: [0, 1, 2, 3, 4]
      - name: aerosol_load_label
        tests:
          - not_null
          - accepted_values:
              values: ['Clear', 'Hazy', 'Elevated', 'High', 'Very high', 'unknown']
      - name: dust_severity_label
        tests:
          - not_null
          - accepted_values:
              values: ['Dusty', 'Heavy dust', 'Severe', 'No dust event', 'unknown']
      - name: aerosol_type
        tests:
          - not_null
          - accepted_values:
              values: ['smoke', 'dust', 'mixed', 'background', 'unknown']
      - name: smoke_fraction
        tests:
          - dbt_utils.accepted_range: { min_value: 0, max_value: 1 }
      - name: dust_fraction
        tests:
          - dbt_utils.accepted_range: { min_value: 0, max_value: 1 }
      - name: valid_fraction
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: dust_status
        tests:
          - not_null
          - accepted_values:
              values: ['positive', 'negative', 'inconclusive', 'not_evaluated']
      - name: transport_status
        tests:
          - not_null
          - accepted_values:
              values: ['positive', 'negative', 'inconclusive', 'not_evaluated']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [aoi_key, date_key]

  - name: serving_climate_indicator_daily
    description: >-
      Climate-Indicator data product, 1 row per AOI per day. warming_flag /
      desertification_flag are null unless evidence decides them
      (warming_status / desertification_status); absent LST/SST is not "no warming".
    columns:
      - name: aoi_key
        tests: [not_null]
      - name: date_key
        tests: [not_null]
      - name: lst_anomaly_band
        tests:
          - accepted_values:
              values: [-1, 0, 1, 2, 3]
      - name: lst_anomaly_label
        tests:
          - accepted_values:
              values: ['Cooler', 'Normal', 'Warm', 'Hot', 'Extreme', 'unknown']
      - name: ndvi_mean
        tests:
          - dbt_utils.accepted_range:
              min_value: -1
              max_value: 1
      - name: evi_mean
        tests:
          - dbt_utils.accepted_range:
              min_value: -1
              max_value: 1
      - name: desertification_proxy
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: warming_status
        tests:
          - not_null
          - accepted_values:
              values: ['positive', 'negative', 'inconclusive', 'not_evaluated']
      - name: desertification_status
        tests:
          - not_null
          - accepted_values:
              values: ['positive', 'negative', 'inconclusive', 'not_evaluated']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [aoi_key, date_key]

  - name: serving_vegetation_health_daily
    description: >-
      Vegetation-Health data product, 1 row per AOI per day. ndvi_trend_dir is
      'unknown' when no trend could be computed; crop_stress_flag is null unless
      evidence decides it (crop_stress_status). Crop stress is evaluated only on
      cropland AOIs (crop_stress_applicable); elsewhere it is 'not_evaluated'.
      A positive is a low/declining NDVI signal, not a verified crop-stress event.
    columns:
      - name: aoi_key
        tests: [not_null]
      - name: date_key
        tests: [not_null]
      - name: ndvi_mean
        tests:
          - dbt_utils.accepted_range:
              min_value: -1
              max_value: 1
      - name: ndvi_health_band
        tests:
          - accepted_values:
              values: [0, 1, 2, 3, 4]
      - name: ndvi_health_label
        tests:
          - accepted_values:
              values: ['Bare / water', 'Sparse', 'Moderate', 'Healthy', 'Dense', 'unknown']
      - name: ndvi_trend_dir
        tests:
          - accepted_values:
              values: ['improving', 'declining', 'flat', 'unknown']
      - name: crop_stress_status
        tests:
          - not_null
          - accepted_values:
              values: ['positive', 'negative', 'inconclusive', 'not_evaluated']
      - name: crop_stress_applicable
        tests: [not_null]
      - name: valid_pixel_fraction
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [aoi_key, date_key]

  - name: mv_kpi_climate_daily
    description: >-
      Materialized climate/dust/air-quality daily KPI rollup per analysis region
      (executive/weather view). Regions are never summed together; only
      rollup-eligible AOIs (non-overlapping reporting partition) are counted.
    columns:
      - name: date_key
        tests: [not_null]
      - name: region
        tests:
          - not_null
          - accepted_values:
              values: ['UAE-GULF', 'INDIA', 'US-LEGACY', 'UNASSIGNED']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [date_key, region]
