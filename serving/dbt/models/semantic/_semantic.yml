version: 2

# Semantic reference-dimension contracts (Phase 11b). The two new conformed
# dimensions carry the units/thresholds the climate products reference; their
# business keys must be unique and non-null.
models:
  - name: dim_pollutant
    description: "Conformed pollutant/aerosol dimension (units, AQI scheme, WHO thresholds)."
    columns:
      - name: pollutant_code
        tests: [not_null, unique]
      - name: measure_type
        tests:
          - accepted_values:
              values: ['surface_concentration', 'column_density', 'optical']
      - name: aqi_breakpoints
        tests: [not_null]
      - name: severity_bands
        tests: [not_null]

  - name: dim_climate_indicator
    description: "Conformed climate/vegetation indicator dimension (unit, source family)."
    columns:
      - name: indicator_code
        tests: [not_null, unique]
      - name: anomaly_bands
        tests: [not_null]
      - name: requires_new_ingest
        tests:
          - accepted_values:
              values: [false]
