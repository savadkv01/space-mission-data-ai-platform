# ============================================================================
# BI Stack — Apache Superset
# Extends docker-compose.yml. Start AFTER storage (needs PostgreSQL metadata DB).
#   docker compose -f docker-compose.yml -f docker-compose.bi.yml up -d
#
# NOTE: YAML anchors are file-scoped in Docker Compose, so the shared anchors
# from docker-compose.yml are re-declared here. Networks/volumes are inherited
# from the base file at merge time.
#
# Superset is split into its own stack file (Phase 7) so BI can be started,
# stopped, and scaled independently of the observability stack.
# ============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging

services:
  superset:
    <<: *service-defaults
    image: space-platform/superset:latest
    build:
      context: ../..
      dockerfile: infrastructure/docker/superset.Dockerfile
    profiles: ["bi", "obs", "all"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_LOAD_EXAMPLES: "no"
      # Stock apache/superset config.py hardcodes SQLite and only honors the
      # SUPERSET__SQLALCHEMY_DATABASE_URI env override, so point the metadata
      # store at the dedicated 'superset' PostgreSQL database.
      SUPERSET__SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/superset
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USER}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    # First boot runs migrations + admin bootstrap, then hands off to the server.
    command:
      - /bin/sh
      - -c
      - >-
        superset db upgrade &&
        superset fab create-admin
        --username "$${ADMIN_USERNAME}"
        --firstname Admin --lastname User
        --email admin@space-platform.local
        --password "$${ADMIN_PASSWORD}" || true;
        superset init &&
        exec /app/docker/entrypoints/run-server.sh
    ports:
      - "${SUPERSET_PORT:-8089}:8088"
    volumes:
      - superset-home:/app/superset_home
      # Serving DuckDB data products (built by the serving dbt project) mounted
      # read-only. Container basename is `serving_products` (NOT `serving`) so
      # the DuckDB catalog name does not collide with the `serving` schema.
      - ../../serving/dbt/serving.duckdb:/opt/serving/serving_products.duckdb:ro
    networks:
      - edge-net
      - data-net
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Superset runs db upgrade + init on first boot; allow a grace window.
      start_period: 120s
