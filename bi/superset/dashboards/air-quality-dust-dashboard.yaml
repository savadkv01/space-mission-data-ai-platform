  refresh_frequency: 3600
  default_filters: "{}"
  # RBAC: granted to `ops_airquality` (+ `exec` read). No RLS (all AOIs public).
  native_filter_configuration:
    - id: NF_time
      name: "Time range"
      filterType: filter_time
      targets: []
      defaultDataMask:
        filterState:
          value: "Last 30 days"
    - id: NF_aoi
      name: "AOI"
      filterType: filter_select
      targets:
        - datasetUuid: d1000000-0000-4000-8000-00000000000b
          column: { name: aoi_name }
