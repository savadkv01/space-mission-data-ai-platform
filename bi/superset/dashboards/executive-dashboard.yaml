    meta: { text: "Executive — Space Mission Platform" }
  GRID_ID:
    type: GRID
    id: GRID_ID
    children: [TABS_ID]
    parents: [ROOT_ID]
  TABS_ID:
    type: TABS
    id: TABS_ID
    children: [TAB_OVERVIEW, TAB_DETAILS]
