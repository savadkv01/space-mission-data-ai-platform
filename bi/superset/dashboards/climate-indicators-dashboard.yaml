dashboard_title: "Climate Indicators — Monitoring"
description: "Climate indicators: LST/SST anomalies, vegetation health, water availability, deforestation (real data, 11b products)."
slug: climate-indicators
certified_by: "Climate Analytics Lead"
css: ""
published: true
uuid: e1000000-0000-4000-8000-000000000006
version: 1.0.0
metadata:
  color_scheme: supersetColors
  refresh_frequency: 3600
  default_filters: "{}"
  # RBAC: granted to `ops_climate` (+ `exec` read). No RLS (all AOIs public).
  native_filter_configuration:
    - id: NF_time
      name: "Time range"
      filterType: filter_time
      targets: []
      defaultDataMask:
        filterState:
          value: "Last 90 days"
    - id: NF_aoi
      name: "AOI"
      filterType: filter_select
      targets:
        - datasetUuid: d1000000-0000-4000-8000-00000000000d
          column: { name: aoi_name }
position:
