    id: ROOT_ID
    children: [GRID_ID]
  HEADER_ID:
    type: HEADER
    id: HEADER_ID
    meta: { text: "Climate Indicators — Monitoring" }
  GRID_ID:
    type: GRID
    id: GRID_ID
    children: [TABS_ID]
    parents: [ROOT_ID]
  TABS_ID:
