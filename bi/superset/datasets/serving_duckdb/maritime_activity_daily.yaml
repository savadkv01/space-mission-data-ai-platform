table_name: maritime_activity_daily
main_dttm_col: event_date
description: "Certified: Maritime Activity (UC-18), 1 row per maritime AOI per day from GFW 4Wings (fishing hours, AIS presence, SAR detections). Filter or group by region; null + not_published = unreleased day, not zero. Unmatched SAR detections are review candidates. GFW data: non-commercial use only."
cache_timeout: 3600
schema: null
sql: |
  select
      aoi_key, aoi_name, region, cast(date_key as date) as event_date,
      fishing_hours, fishing_vessels, fishing_status,
      presence_hours, presence_vessels, presence_status,
      sar_detections, sar_unmatched_detections, sar_dark_fraction, sar_status
  from serving.serving_maritime_activity_daily
filter_select_enabled: true
extra:
  certification:
    certified_by: "Maritime Intelligence Lead"
    details: "Area-based GFW 4Wings activity; replaces the identity-search vessel demonstrator for regional analysis."
uuid: d1000000-0000-4000-8000-000000000010
metrics:
  - metric_name: fishing_hours
    verbose_name: Apparent Fishing Hours
    expression: SUM(fishing_hours)
  - metric_name: sar_detections
    verbose_name: SAR Vessel Detections
    expression: SUM(sar_detections)
  - metric_name: sar_unmatched_detections
    verbose_name: SAR Detections Without AIS Match
    expression: SUM(sar_unmatched_detections)
columns:
  - column_name: aoi_key
    type: VARCHAR
  - column_name: aoi_name
    type: VARCHAR
    groupby: true
  - column_name: region
    type: VARCHAR
    groupby: true
  - column_name: event_date
    type: DATE
    is_dttm: true
  - column_name: fishing_hours
    type: DOUBLE
  - column_name: fishing_vessels
    type: DOUBLE
  - column_name: fishing_status
    type: VARCHAR
    groupby: true
  - column_name: presence_hours
    type: DOUBLE
  - column_name: presence_vessels
    type: DOUBLE
  - column_name: presence_status
    type: VARCHAR
    groupby: true
  - column_name: sar_detections
    type: DOUBLE
  - column_name: sar_unmatched_detections
    type: DOUBLE
  - column_name: sar_dark_fraction
    type: DOUBLE
  - column_name: sar_status
    type: VARCHAR
    groupby: true
version: 1.0.0
database_uuid: b1000000-0000-4000-8000-000000000001
